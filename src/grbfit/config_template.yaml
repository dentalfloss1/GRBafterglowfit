# 🔧 GRB Fit Configuration File

burst:
  name: your_grb_name_here
  # Times are in observer-frame days.
  t0: 0.05
  t0_rev: 0.05
  fitstart: 0.01
  z: null

data:
  # Input CSV flux, err, and rms columns are expected in microJy.
  # Input freq columns are expected in GHz.
  radio_file: grbmeas.csv
  other_file: otherdata.txt
  batxrt_file: null
  xrt_photon_index: null
  # Unabsorbed flux / observed flux from the XRT spectrum.
  absorption_ratio: null

model:
  type: forward_only   # options: forward_only, forward_reverse
  # Reverse-shock shell model: thick (default) or thin.
  reverse_shell: thick
  # For a thin reverse shock, fit g within its theoretical bounds.
  # Otherwise g is fixed to the midpoint of those bounds.
  fit_g: false
  # If true, attenuate reverse-shock photons by the forward-shock absorption screen.
  # Defaults to false when omitted.
  apply_fs_absorption: false
  k: 2

fit:
  initial_guess:
    # Electron index p: starting value when fitted, fixed value otherwise.
    # To fit p, set bounds.p below to distinct limits, e.g. [2.0, 3.0].
    p: 2.2
    # Flux normalizations are in Jy at the corresponding reference time.
    f0: 5e-3
    f0_rev: 5e-5
    # Break frequencies are in GHz.
    nua0_rev: 10
    num0_rev: 100
    nuc0_rev: 8e8
    nua_0: 80
    num_0: 1e4
    nuc_0: 2e8
    # Jet-break time is in observer-frame days; null disables the jet.
    # To fit an early jet break, use an initial value such as 0.3.
    t_j: null
  bounds:
    # Set lower and upper equal to remove a parameter from fitting.
    # The fixed value will be the corresponding initial_guess value.
    p: [2.2, 2.2]  # Fixed by default; change to [2.0, 3.0] to fit p.
    # Flux normalization bounds are in Jy.
    f0: [1e-8, 10]
    f0_rev: [1e-8, 1e5]
    # Break-frequency bounds are in GHz. Non-overlapping nu_a/nu_c
    # ranges ensure nu_a < nu_c at the reference epoch (bounds are open).
    nua0_rev: [1, 1e6]
    num0_rev: [1e-2, 1e9]
    nuc0_rev: [1e6, 1e12]
    nua_0: [1, 1e6]
    num_0: [1e-2, 1e9]
    nuc_0: [1e6, 1e12]
    # Jet-break time bounds are in observer-frame days.
    t_j: [0.05, 1e3]
  # Minimum observed frequency in GHz (inclusive). Lower frequencies are plotted
  # for reference but excluded from fitting. Use null for no cutoff, or e.g. 50.
  min_freq: null
  max_rest_freq: 2.47e6 # GHz, FUV in rest frame, only used in z is defined.
  # Admit non-X-ray bands above max_rest_freq with at least 3 detections.
  # Frequencies within a 1% span share a band and correction.
  # Each band gets a correction C >= 1: observed model = intrinsic model / C.
  fit_above_max_rest_freq: false
  extinction_correction_bounds: [1, 1000]
  extinction_correction_initial: 2
  fit_xrt: false
  # Include selected nondetections as 3-sigma upper limits (default: true).
  fit_upper_limits: true
  # MCMC controls. Use mcmc_mode: fixed for a quick fixed-length run.
  mcmc_mode: adaptive
  nwalkers: 32
  burn_in: 1000
  nsteps: 2000
  max_steps: 50000
  check_interval: 1000
  autocorr_ratio: 50
  autocorr_tol: 0.02
